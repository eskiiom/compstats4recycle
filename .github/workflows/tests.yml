name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Validation syntaxique
        shell: powershell
        run: .\validation-syntax.ps1

      - name: Tests Pester
        shell: powershell
        run: |
          # Windows PowerShell ships Pester 3.4.0; CompStats.Tests.ps1 uses its
          # "Should Be" syntax (removed in Pester 5), so pin this version even
          # if a newer Pester is also present on the runner image.
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Script .\CompStats.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) test(s) Pester en echec"
            exit 1
          }

  test-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Tests unitaires
        run: python3 -m unittest test_compstats -v

      - name: Execution reelle (validation sur du materiel Apple reel)
        run: python3 compstats.py --no-csv-log --no-index

      - name: Verifier que le rapport a ete genere
        run: |
          ls -la Rapports/
          test -f Rapports/*.html

  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Tests unitaires
        run: bash test_compstats.sh

      - name: Execution reelle (validation sur une vraie VM Linux)
        run: bash compstats.sh --no-csv-log --no-index

      - name: Verifier que le rapport a ete genere
        run: |
          ls -la Rapports/
          test -f Rapports/*.html
